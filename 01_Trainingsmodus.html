<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Trainingsmodus – Trainingsportal ESV Grein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#1f5e3a;
    --red:#b93a32;
    --gold:#ffdf8c;
    --dark:#102417;
    --light:#eef5e9;
    --border:#d7e4cf;

    --bg-main:#0a0e14;
    --bg-panel:#131b24;
    --line:rgba(255,255,255,0.08);
    --text-main:#eef2f6;
    --text-dim:#8a97a6;
    --accent:#ffdf8c;
    --accent-hover:#f7cf5c;
    --font-display:"Space Grotesk","Inter",sans-serif;
    --font-body:"Inter",Segoe UI,Arial,sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
}

body{
    font-family:var(--font-body);
    background:
        radial-gradient(900px 400px at 10% -10%, rgba(255,223,140,0.08), transparent 60%),
        linear-gradient(135deg, #17351f, #0d1f13);
    color:#222;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.app-header{
    position: sticky;
    top: 0;
    z-index: 501;
    background: var(--green);
    color: #fff;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
    font-size: 14px;
}
.app-header .app-header-title{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .02em;
}
.app-header .app-header-logo{ width: 26px; height: 26px; flex-shrink: 0; }
.app-header .app-header-controls{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.app-header a, .app-header button{
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.14);
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease;
}
.app-header a:hover, .app-header button:hover{ background: rgba(255,255,255,0.24); }
.app-header .app-header-back{ background: transparent; padding: 6px 4px; }
.app-header .app-header-back:hover{ background: rgba(255,255,255,0.14); }
/* Hochformat-Hinweis: die App ist für Querformat (Smartphone liegend) optimiert */
.rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(13, 31, 19, 0.97);
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 24px;
    font-size: 1rem;
}
.rotate-hint .rotate-icon { font-size: 2.5rem; animation: rotate-hint-spin 1.8s ease-in-out infinite; }
@keyframes rotate-hint-spin {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
}
@media (orientation: portrait) and (max-width: 600px) {
    .rotate-hint { display: flex; }
}

/* ============================================================
   KOMPAKT-ANSICHT FÜR BEGRENZTE BILDSCHIRMHÖHE
   (Tablets/Touch-Monitore im Querformat, z. B. 1280×800 – breit,
   aber wenig Höhe. Reine Breiten-Media-Queries greifen hier NICHT,
   da diese Geräte oft sehr breit sind.)
   ============================================================ */
@media (max-height: 820px) {
    .app-header{ padding: 5px 14px; font-size: 12px; }
    .app-header .app-header-logo{ width: 20px; height: 20px; }

    .header{ padding: 6px 14px; gap: 8px; }
    .header h1{ font-size: 1.1rem; }
    .header-clock{ font-size: 0.7rem; padding: 2px 8px; }
    .header-clock .clock-date{ display: none; }
    .header-controls select, .header-controls button{ padding: 4px 8px; font-size: 0.8rem; }
    .player-selector select{ padding: 4px 8px; }

    .game-header-card{ padding: 8px 16px 10px; margin: 0 14px 8px; }
    .game-header-title{ font-size: 0.75rem; margin-bottom: 2px; }
    .big-score-row{ gap: 14px; }
    .big-score{ font-size: 2.6rem; }
    .big-score-sep{ font-size: 1.3rem; }
    .game-meta{ margin-top: 2px; font-size: 0.75rem; }
    .status-pill{ margin-top: 4px; padding: 2px 12px; font-size: 0.65rem; }
    .wins-row{ margin-top: 6px; font-size: 0.75rem; gap: 12px; }

    .tabs{ margin-bottom: 4px; }
    .tab-btn{ padding: 5px 12px; font-size: 0.75rem; }

    .kehren-table{ border-spacing: 0 5px; padding: 0 10px; }
    .kehren-table td{ padding: 6px 4px; font-size: 0.9rem; }

    .quick-entry{ margin: 4px 10px 8px; padding: 8px; }
    .quick-entry-title{ margin-bottom: 6px; font-size: 0.7rem; }
    .quick-btn{ width: 34px; height: 34px; font-size: 13px; }
    .swap-btn{ width: 30px; height: 30px; font-size: 13px; }
    .quick-actions{ margin-top: 8px; }
    .btn-save-kehre, .btn-cancel-kehre{ padding: 8px 16px; font-size: 0.8rem; }
}

@media (max-height: 620px) {
    .header-clock{ display: none; }
    .big-score{ font-size: 2.1rem; }
    .game-header-card{ padding: 6px 14px 8px; }
    .wins-row{ margin-top: 4px; }
    .footer{ padding: 8px; }
}


.topbar{
    position: sticky;
    top: 0;
    z-index: 501;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    padding:8px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
    font-size:13px;
}
.topbar a{ color:var(--text-dim); text-decoration:none; }
.topbar a:hover{ color:var(--text-main); }
.topbar .logout{ border:1px solid var(--line); padding:5px 12px; border-radius:8px; }
.topbar .logout:hover{ border-color:var(--text-dim); }

.header{
    position: sticky;
    top: 0;
    z-index: 500;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    color:var(--text-main);
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    flex-shrink:0;
}

.header h1{
    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:-0.01em;
    font-size:1.6rem;
    color:var(--text-main);
}
.header h1::before{
    content:"Modul 01";
    display:block;
    font-family:var(--font-body);
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11px;
    color:var(--accent);
    font-weight:700;
}

/* ===== UHRZEIT ANZEIGE ===== */
.header-clock {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    padding: 4px 14px 4px 12px;
    border-radius: 30px;
    border: 1px solid var(--line);
    white-space: nowrap;
}

.header-clock .clock-icon {
    font-size: 0.9rem;
}
.header-clock .clock-time {
    font-weight: 600;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
}
.header-clock .clock-date {
    font-size: 0.7rem;
    color: var(--text-dim);
}

.header-controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

button,
select,
input{
    border:none;
    border-radius:12px;
    padding:10px 14px;
    font-size:1rem;
    touch-action: manipulation;
}

button{
    cursor:pointer;
    background:var(--accent);
    color:#05161e;
    font-weight:700;
    touch-action: manipulation;
    transition: transform 0.1s, background 0.15s;
}
button:hover{ background:var(--accent-hover); }

button:active {
    transform: scale(0.95);
}

.layout{
    flex: 1;
    padding:16px;
    overflow: hidden;
    min-height: 0;
}

.arena{
    width:100%;
    max-width:1200px;
    height:100%;
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    display:flex;
    flex-direction:column;
    margin: 0 auto;
}

.arena-header{
    background:var(--light);
    padding:12px 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.arena-title{
    font-size:1.6rem;
    font-weight:900;
    color:var(--green);
    text-align:center;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 14px 14px;
    flex-shrink:0;
}

.score-card{
    background:#f7faf5;
    border-radius:18px;
    padding:16px 20px;
    text-align:center;
    border-bottom:8px solid var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
}

.score-card.red{
    border-bottom-color:var(--red);
}

.team-info{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
}

.team-name{
    font-size:1.2rem;
    font-weight:900;
}

.team-score{
    font-size:3.4rem;
    font-weight:900;
    color:var(--green);
    line-height:1;
}

.score-card.red .team-score{
    color:var(--red);
}

.team-wins{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--dark);
    color:white;
    padding:6px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:1.2rem;
    white-space:nowrap;
}

.team-wins span{
    font-size:1.4rem;
}

.kehren-wrapper{
    flex:1;
    overflow-y:auto;
    padding:0 14px 14px;
    min-height:0;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
}

.kehren-wrapper::-webkit-scrollbar{
    width:8px;
}

.kehren-wrapper::-webkit-scrollbar-track{
    background:#f0f0f0;
    border-radius:10px;
}

.kehren-wrapper::-webkit-scrollbar-thumb{
    background:var(--green);
    border-radius:10px;
}

.kehren-wrapper::-webkit-scrollbar-thumb:hover{
    background:#0d3d22;
}

.kehren{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.kehren-title{
    text-align:center;
    font-weight:900;
    margin-bottom:8px;
}

.kehre-row{
    display:grid;
    grid-template-columns:90px 1fr 45px;
    gap:8px;
    align-items:center;
    background:white;
    border:2px solid var(--border);
    border-radius:14px;
    padding:8px;
    margin-bottom:8px;
    transition: all 0.2s ease;
    cursor: pointer;
    touch-action: manipulation;
}

.kehre-row:active {
    transform: scale(0.98);
}

.kehre-row.active{
    border:3px solid #4caf50;
    background:#f3fff2;
    box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
}

.kehre-row.completed{
    border:3px solid #ff9800;
    background:#fff8e1;
}

.kehre-number{
    font-size:.9rem;
    font-weight:900;
    text-align:center;
}

.points{
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:wrap;
}

.point-btn{
    width:44px;
    height:44px;
    border-radius:10px;
    border:2px solid var(--border);
    background:white;
    color:black;
    font-weight:900;
    font-size:16px;
    touch-action: manipulation;
    transition: all 0.15s;
    display:flex;
    align-items:center;
    justify-content:center;
}

.point-btn:active {
    transform: scale(0.92);
    background:var(--green);
    color:white;
}

.point-btn.active-point{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.kehre-value{
    text-align:center;
    font-weight:900;
    font-size:1.1rem;
}

.footer{
    position: sticky;
    bottom: 0;
    z-index: 100;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:14px;
    border-top:1px solid var(--border);
    flex-shrink:0;
    background: white;
}

.footer .footer-left {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.footer .footer-right {
    font-size:0.85rem;
    color:#555;
    background:var(--light);
    padding:4px 14px;
    border-radius:30px;
    font-weight:500;
    letter-spacing:0.3px;
    margin-left:20px;
}

/* ============================================================
   NEUE KEHREN-EINGABE (Tabelle + Schnell-Eingabe-Panel)
   ============================================================ */

.game-header-card{
    background:#f7faf5;
    border-radius:18px;
    padding:20px 20px 24px;
    margin:0 14px 14px;
    text-align:center;
    flex-shrink:0;
}
.game-header-title{
    font-size:.95rem;
    font-weight:800;
    letter-spacing:.08em;
    color:#7a8a86;
    text-transform:uppercase;
    margin-bottom:8px;
}
.big-score-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
}
.big-score{
    font-size:5rem;
    font-weight:900;
    line-height:1;
}
.big-score.team-a{ color:#1a5fb4; }
.big-score.team-b{ color:var(--red); }
.big-score-sep{
    font-size:2.4rem;
    font-weight:900;
    color:#9aa79f;
}
.game-meta{
    margin-top:6px;
    font-size:.85rem;
    color:#7a8a86;
}
.status-pill{
    display:inline-block;
    margin-top:8px;
    padding:4px 16px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    background:#e3f7e9;
    color:#1f9d55;
}
.status-pill.finished{
    background:#ffe6cc;
    color:#b65c00;
}
.wins-row{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:16px;
    font-size:.85rem;
    font-weight:700;
    color:#556;
}

.tabs{
    display:flex;
    gap:4px;
    padding:0 14px;
    margin-bottom:10px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
}
.tab-btn{
    background:none;
    border:none;
    padding:8px 14px;
    font-size:.85rem;
    font-weight:800;
    color:#8a97a0;
    border-bottom:3px solid transparent;
    cursor:pointer;
    touch-action:manipulation;
}
.tab-btn.active{
    color:#1a5fb4;
    border-bottom-color:#1a5fb4;
}
.tab-btn[disabled]{
    cursor:not-allowed;
    opacity:.55;
}

.kehren-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 8px;
    padding:0 14px;
}
.kehren-table th{
    font-size:.7rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#8a97a0;
    font-weight:800;
    text-align:center;
    padding-bottom:4px;
}
.kehren-table td{
    background:white;
    border-top:2px solid var(--border);
    border-bottom:2px solid var(--border);
    padding:10px 6px;
    text-align:center;
    font-weight:800;
    font-size:1.05rem;
}
.kehren-table td:first-child{
    border-left:2px solid var(--border);
    border-radius:12px 0 0 12px;
    font-weight:700;
    font-size:.8rem;
    color:#7a8a86;
}
.kehren-table td:last-child{
    border-right:2px solid var(--border);
    border-radius:0 12px 12px 0;
}
.kehren-table tr.editing td{
    border-color:#1a5fb4;
    background:#eef5ff;
}
.kehren-table td.val-a{ color:#1a5fb4; background:#f2f7ff; }
.kehren-table td.val-b{ color:var(--red); background:#fff3f2; }
.kehren-table tr.editing td.val-a{ background:#e2edff; }
.kehren-table tr.editing td.val-b{ background:#ffe4e2; }

.row-actions{
    display:flex;
    gap:6px;
    justify-content:center;
}
.icon-btn{
    width:32px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:white;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:.9rem;
    cursor:pointer;
    touch-action:manipulation;
}
.icon-btn.edit{ color:#1a5fb4; border-color:#bcd6f7; }
.icon-btn.delete{ color:var(--red); border-color:#f3c6c2; }
.icon-btn:active{ transform:scale(0.92); }

.quick-entry{
    flex-shrink:0;
    margin:6px 14px 14px;
    background:#fbfdfb;
    border:2px solid var(--border);
    border-radius:16px;
    padding:14px;
    box-shadow:0 -4px 14px rgba(0,0,0,0.06);
}
.quick-entry-title{
    font-size:.8rem;
    font-weight:800;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#7a8a86;
    margin-bottom:10px;
    text-align:center;
}
.quick-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.quick-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
}
.quick-btn{
    width:42px;
    height:42px;
    border-radius:10px;
    border:2px solid var(--border);
    background:white;
    font-weight:900;
    font-size:15px;
    touch-action:manipulation;
    transition: all .15s ease;
}
.quick-btn.team-a{ color:#1a5fb4; }
.quick-btn.team-b{ color:var(--red); }
.quick-btn.team-a.selected{ background:#1a5fb4; color:white; border-color:#1a5fb4; }
.quick-btn.team-b.selected{ background:var(--red); color:white; border-color:var(--red); }
.quick-btn:active{ transform:scale(0.92); }

.swap-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--border);
    background:white;
    font-size:16px;
    cursor:pointer;
    touch-action:manipulation;
    flex-shrink:0;
}
.swap-btn:active{ transform:scale(0.9); }

.quick-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
}
.btn-save-kehre, .btn-cancel-kehre{
    padding:12px 22px;
    border-radius:12px;
    font-weight:800;
    font-size:.9rem;
    border:none;
    cursor:pointer;
    touch-action:manipulation;
    display:inline-flex;
    align-items:center;
    gap:6px;
}
.btn-save-kehre{ background:var(--green); color:white; }
.btn-save-kehre:active{ transform:scale(0.97); }
.btn-cancel-kehre{ background:white; color:#556; border:2px solid var(--border); }

/* ===== SCHÜSSE-TAB (Spielserie & PDF-Export) ===== */
.schuesse-wrapper{
    flex:1;
    overflow-y:auto;
    min-height:0;
    padding:0 14px 14px;
    display:flex;
    flex-direction:column;
    gap:14px;
}
.schuesse-empty{
    text-align:center;
    color:#8a97a0;
    padding:40px 20px;
    font-size:.9rem;
}
.pdf-header{
    text-align:center;
    padding:6px 0 4px;
}
.pdf-title{
    font-weight:900;
    font-size:1.1rem;
    color:var(--green);
}
.pdf-meta{
    font-size:.8rem;
    color:#556;
    margin-top:2px;
}
.schuss-games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px;
    margin-top:10px;
}
.schuss-game-card{
    background:white;
    border:2px solid var(--border);
    border-radius:14px;
    padding:12px;
    break-inside:avoid;
}
.schuss-game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    font-size:.9rem;
    color:var(--green);
    margin-bottom:8px;
}
.schuss-game-time{
    font-size:.75rem;
    color:#8a97a0;
    font-weight:600;
}
.schuss-game-result{
    text-align:center;
    font-weight:800;
    font-size:.85rem;
    color:#556;
    margin-top:6px;
}
.schuss-game-result.in-progress{
    color:#b65c00;
}
.btn-export-pdf{
    flex-shrink:0;
    align-self:center;
    padding:12px 24px;
    border-radius:12px;
    font-weight:800;
    font-size:.9rem;
    border:none;
    cursor:pointer;
    touch-action:manipulation;
    background:var(--green);
    color:white;
}
.btn-export-pdf:active{ transform:scale(0.97); }

@media print {
    body * { visibility:hidden; }
    #pdfExportArea, #pdfExportArea * { visibility:visible; }
    #pdfExportArea{
        position:absolute;
        top:0; left:0;

<script src="auth.js"></script>
<script>
requireGate();
requireLogin();

// ============================================================
// UHRZEIT & DATUM FÜR MODUL
// ============================================================
function updateModuleClock() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateStr = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
    
    const clockEl = document.getElementById('moduleClock');
    const dateEl = document.getElementById('moduleDate');
    if (clockEl) clockEl.textContent = timeStr;
    if (dateEl) dateEl.textContent = '📅 ' + dateStr;
}

// Initial aktualisieren und dann jede Sekunde
updateModuleClock();
setInterval(updateModuleClock, 1000);

// ============================================================
// TRAININGSMODUS LOGIK
// ============================================================
const state = {
    kehren: 6,
    winsToChampion: 2,
    playerCount: 4,
    arena: createArena(1),
    editingIndex: null,          // null = automatisch nächste offene Kehre
    pendingKehre: { a: null, b: null },
    activeTab: 'kehren',         // 'kehren' oder 'schuesse'
    history: [],                 // abgeschlossene Spiele der aktuellen Trainingsserie
    trainingStarted: new Date()  // Datum/Uhrzeit für den PDF-Export
};

function createArena(id) {
    return {
        id,
        teamA: 'Mannschaft W',
        teamB: 'Mannschaft E',
        pointsA: Array(6).fill(null),
        pointsB: Array(6).fill(null),
        winsA: 0,
        winsB: 0,
        gameNumber: 1
    };
}

function render() {
    document.getElementById('layout').innerHTML = renderArena(state.arena);
    scrollToActiveKehre();
}

function renderArena(arena) {
    const scoreA = sum(arena.pointsA);
    const scoreB = sum(arena.pointsB);
    const finished = hasWinner(arena);
    const activeIdx = getEditingIndex(arena);
    const onSchuesseTab = state.activeTab === 'schuesse';

    return `
    <div class="arena">
        <div class="arena-header">
            <div class="arena-title">🥌 ESV Grein – Training</div>
        </div>

        <div class="game-header-card">
            <div class="game-header-title">Spiel ${arena.gameNumber}</div>
            <div class="big-score-row">
                <div class="big-score team-a">${scoreA}</div>
                <div class="big-score-sep">:</div>
                <div class="big-score team-b">${scoreB}</div>
            </div>
            <div class="game-meta">${state.kehren} Kehren</div>
            <div class="status-pill ${finished ? 'finished' : ''}">${finished ? 'Beendet' : 'Läuft'}</div>
            <div class="wins-row">
                <span>🏆 ⚪ ${arena.teamA}: ${arena.winsA}</span>
                <span>🏆 🔴 ${arena.teamB}: ${arena.winsB}</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn ${onSchuesseTab ? '' : 'active'}" onclick="switchTab('kehren')">Kehren</button>
            <button class="tab-btn ${onSchuesseTab ? 'active' : ''}" onclick="switchTab('schuesse')">📄 Schüsse</button>
        </div>

        ${onSchuesseTab ? renderSchuesseTab(arena) : `
        <div class="kehren-wrapper" id="kehrenWrapper">
            ${renderKehrenTable(arena, activeIdx)}
        </div>
        ${finished ? '' : renderQuickEntry(arena, activeIdx)}
        `}

        <div class="footer">
            <div class="footer-left">
                <button class="gold" onclick="evaluateGame()">Spiel Werten</button>
                <button onclick="resetGame()">Neues Spiel Starten</button>
            </div>
            <div class="footer-right">@Roland Koll Version 1.1</div>
        </div>
    </div>
    `;
}

function switchTab(name) {
    state.activeTab = name;
    render();
}

function renderSchuesseTab(arena) {
    const games = [...state.history];

    // Laufendes Spiel mit anzeigen, sofern schon Kehren gespielt wurden
    const hasCurrentData = arena.pointsA.some(v => v !== null) || arena.pointsB.some(v => v !== null);
    if (!hasWinner(arena) && hasCurrentData) {
        games.push({
            gameNumber: arena.gameNumber,
            timestamp: null,
            pointsA: [...arena.pointsA],
            pointsB: [...arena.pointsB],
            scoreA: sum(arena.pointsA),
            scoreB: sum(arena.pointsB),
            resultLabel: 'Läuft …',
            inProgress: true
        });
    }

    if (games.length === 0) {
        return `
        <div class="schuesse-wrapper">
            <div class="schuesse-empty">Noch keine Kehren in dieser Trainingsserie gespielt.</div>
        </div>
        `;
    }

    const dateStr = state.trainingStarted.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = state.trainingStarted.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    const gamesHtml = games.map(g => {
        let rows = '';
        for (let i = 0; i < state.kehren; i++) {
            rows += `
            <tr>
                <td>Kehre ${i + 1}</td>
                <td class="val-a">${g.pointsA[i] ?? '-'}</td>
                <td class="val-b">${g.pointsB[i] ?? '-'}</td>
            </tr>
            `;
        }
        const gameTime = g.timestamp
            ? g.timestamp.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
            : 'läuft';

        return `
        <div class="schuss-game-card">
            <div class="schuss-game-header">
                <span>Spiel ${g.gameNumber}</span>
                <span class="schuss-game-time">🕐 ${gameTime}</span>
            </div>
            <table class="summary-table">
                <thead><tr><th></th><th>⚪ ${arena.teamA}</th><th>🔴 ${arena.teamB}</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div class="schuss-game-result ${g.inProgress ? 'in-progress' : ''}">
                ${g.inProgress ? '⏳ Läuft' : g.resultLabel} (${g.scoreA}:${g.scoreB})
            </div>
        </div>
        `;
    }).join('');

    return `
    <div class="schuesse-wrapper" id="schuesseWrapper">
        <div id="pdfExportArea">
            <div class="pdf-header">
                <div class="pdf-title">🥌 ESV Grein – Trainingsprotokoll</div>
                <div class="pdf-meta">📅 ${dateStr} &nbsp;·&nbsp; 🕐 Start ${timeStr} Uhr</div>
                <div class="pdf-meta">🏆 Stand: ⚪ ${arena.teamA} ${arena.winsA} : ${arena.winsB} 🔴 ${arena.teamB}</div>
            </div>
            <div class="schuss-games-grid">${gamesHtml}</div>
        </div>
        <button class="btn-export-pdf no-print" onclick="window.print()">📄 Als PDF exportieren / Drucken</button>
    </div>
    `;
}

function renderKehrenTable(arena, activeIdx) {
    let rows = '';
    for (let i = 0; i < state.kehren; i++) {
        const a = arena.pointsA[i];
        const b = arena.pointsB[i];
        const isEditing = i === activeIdx;
        rows += `
        <tr class="${isEditing ? 'editing' : ''}">
            <td>Kehre ${i + 1}</td>
            <td class="val-a">${a ?? '-'}</td>
            <td class="val-b">${b ?? '-'}</td>
            <td>
                <div class="row-actions">
                    <button class="icon-btn edit" onclick="editKehreRow(${i})" title="Kehre ${i + 1} bearbeiten">✏️</button>
                    <button class="icon-btn delete" onclick="deleteKehreRow(${i})" title="Kehre ${i + 1} löschen">🗑️</button>
                </div>
            </td>
        </tr>
        `;
    }

    return `
    <table class="kehren-table">
        <thead>
            <tr>
                <th></th>
                <th>⚪ ${arena.teamA}</th>
                <th>🔴 ${arena.teamB}</th>
                <th>Aktionen</th>
            </tr>
        </thead>
        <tbody>${rows}</tbody>
    </table>
    `;
}

function renderQuickEntry(arena, activeIdx) {
    const maxPoints = state.playerCount;
    const pending = state.pendingKehre;

    function buildButtons(team) {
        let html = '';
        for (let v = 0; v <= maxPoints; v++) {
            const selected = pending[team] === v;
            html += `<button class="quick-btn ${team === 'a' ? 'team-a' : 'team-b'} ${selected ? 'selected' : ''}"
                             onclick="selectQuickValue('${team}', ${v})">${v}</button>`;
        }
        return html;
    }

    return `
    <div class="quick-entry">
        <div class="quick-entry-title">Schnell-Eingabe für Kehre ${activeIdx + 1}</div>
        <div class="quick-row">
            <div class="quick-buttons">${buildButtons('a')}</div>
            <button class="swap-btn" onclick="swapQuickValues()" title="Werte tauschen">⇄</button>
            <div class="quick-buttons">${buildButtons('b')}</div>
        </div>
        <div class="quick-actions">
            <button class="btn-save-kehre" onclick="saveQuickKehre()">✓ Kehre speichern</button>
            <button class="btn-cancel-kehre" onclick="cancelQuickKehre()">✗ Kehre abbrechen</button>
        </div>
    </div>
    `;
}

// ============================================================
// SCHNELL-EINGABE FÜR DIE AKTUELLE KEHRE
// ============================================================

function getEditingIndex(arena) {
    if (state.editingIndex !== null && state.editingIndex >= 0 && state.editingIndex < state.kehren) {
        return state.editingIndex;
    }
    return Math.min(activeKehre(arena) - 1, state.kehren - 1);
}

function selectQuickValue(team, value) {
    const arena = state.arena;
    if (hasWinner(arena)) {
        toast('Training beendet');
        return;
    }

    state.pendingKehre[team] = value;

    // Wenn eine Mannschaft Punkte (>0) erhält, wird die Gegner-Mannschaft
    // automatisch mit 0 vorbelegt, sofern dort noch nichts gewählt wurde
    // (nur eine Mannschaft kann pro Kehre punkten).
    const other = team === 'a' ? 'b' : 'a';
    if (value > 0 && state.pendingKehre[other] === null) {
        state.pendingKehre[other] = 0;
    }

    render();
}

function swapQuickValues() {
    const { a, b } = state.pendingKehre;
    state.pendingKehre.a = b;
    state.pendingKehre.b = a;
    render();
}

function saveQuickKehre() {
    const arena = state.arena;
    if (hasWinner(arena)) {
        toast('Training beendet');
        return;
    }

    const idx = getEditingIndex(arena);
    const { a, b } = state.pendingKehre;

    if (a === null && b === null) {
        toast('Bitte zuerst einen Wert auswählen');
        return;
    }

    arena.pointsA[idx] = a ?? 0;
    arena.pointsB[idx] = b ?? 0;

    toast(`Kehre ${idx + 1} gespeichert: ${arena.pointsA[idx]} : ${arena.pointsB[idx]}`);

    // Zur nächsten offenen Kehre weiterspringen
    state.editingIndex = null;
    state.pendingKehre = { a: null, b: null };

    render();
}

function cancelQuickKehre() {
    state.pendingKehre = { a: null, b: null };
    render();
}

function editKehreRow(index) {
    const arena = state.arena;
    if (hasWinner(arena)) {
        toast('Training beendet');
        return;
    }
    state.editingIndex = index;
    state.pendingKehre = {
        a: arena.pointsA[index],
        b: arena.pointsB[index],
    };
    render();
    scrollToQuickEntry();
}

function deleteKehreRow(index) {
    const arena = state.arena;
    if (hasWinner(arena)) {
        toast('Training beendet');
        return;
    }
    if (arena.pointsA[index] === null && arena.pointsB[index] === null) {
        toast(`Kehre ${index + 1} ist bereits leer`);
        return;
    }

    arena.pointsA[index] = null;
    arena.pointsB[index] = null;

    if (state.editingIndex === index) {
        state.editingIndex = null;
        state.pendingKehre = { a: null, b: null };
    }

    render();
    toast(`Kehre ${index + 1} gelöscht`);
}

function scrollToQuickEntry() {
    setTimeout(() => {
        const panel = document.querySelector('.quick-entry');
        if (panel) {
            panel.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }, 50);
}

function scrollToActiveKehre() {
    setTimeout(() => {
        const wrapper = document.getElementById('kehrenWrapper');
        if (!wrapper) return;

        const activeRow = wrapper.querySelector('tr.editing');
        if (activeRow) {
            const wrapperRect = wrapper.getBoundingClientRect();
            const rowRect = activeRow.getBoundingClientRect();

            const isVisible =
                rowRect.top >= wrapperRect.top + 10 &&
                rowRect.bottom <= wrapperRect.bottom - 10;

            if (!isVisible) {
                activeRow.scrollIntoView({
                    block: 'center',
                    behavior: 'smooth'
                });
            }
        }
    }, 50);
}

function evaluateGame() {
    const arena = state.arena;

    if (hasWinner(arena)) {
        toast('Training beendet');
        return;
    }

    for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
            toast('Bitte alle Kehren ausfüllen');
            return;
        }
    }

    const a = sum(arena.pointsA);
    const b = sum(arena.pointsB);
    let resultLabel;

    if (a > b) {
        arena.winsA++;
        resultLabel = `⚪ ${arena.teamA} gewinnt (${a}:${b})`;
    } else if (b > a) {
        arena.winsB++;
        resultLabel = `🔴 ${arena.teamB} gewinnt (${a}:${b})`;
    } else {
        resultLabel = `Unentschieden (${a}:${b})`;
    }
    toast(resultLabel);

    // Abgeschlossenes Spiel in der Spielserien-Historie sichern
    // (für den "Schüsse"-Tab und den PDF-Export), BEVOR die Kehren
    // für das nächste Spiel zurückgesetzt werden.
    state.history.push({
        gameNumber: arena.gameNumber,
        timestamp: new Date(),
        pointsA: [...arena.pointsA],
        pointsB: [...arena.pointsB],
        scoreA: a,
        scoreB: b,
        resultLabel
    });

    arena.pointsA = Array(state.kehren).fill(null);
    arena.pointsB = Array(state.kehren).fill(null);
    arena.gameNumber++;
    state.editingIndex = null;
    state.pendingKehre = { a: null, b: null };

    if (hasWinner(arena)) {
        toast(`🏆 ${winnerName(arena)} gewinnt das Training!`);
    } else {
        toast(`➡️ Spiel ${arena.gameNumber} beginnt`);
    }

    render();
}

function activeKehre(arena) {
    for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
            return i + 1;
        }
    }
    return state.kehren;
}

function hasWinner(arena) {
    return arena.winsA >= state.winsToChampion || arena.winsB >= state.winsToChampion;
}

function winnerName(arena) {
    if (arena.winsA >= state.winsToChampion) return 'Mannschaft W';
    if (arena.winsB >= state.winsToChampion) return 'Mannschaft E';
    return '';
}

function sum(arr) {
    return arr.reduce((a, b) => a + (b || 0), 0);
}

function resetGame() {
    const arena = state.arena;
    arena.pointsA = Array(state.kehren).fill(null);
    arena.pointsB = Array(state.kehren).fill(null);
    arena.winsA = 0;
    arena.winsB = 0;
    arena.gameNumber = 1;
    state.editingIndex = null;
    state.pendingKehre = { a: null, b: null };
    state.history = [];
    state.trainingStarted = new Date();
    state.activeTab = 'kehren';
    render();
    toast('Spiel neu gestartet');
}

function fullReset() {
    state.arena = createArena(1);
    state.editingIndex = null;
    state.pendingKehre = { a: null, b: null };
    state.history = [];
    state.trainingStarted = new Date();
    state.activeTab = 'kehren';
    render();
    toast('Kompletter Reset');
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== EVENT-LISTENER =====
document.getElementById('playerCount').addEventListener('change', function(e) {
    state.playerCount = Number(e.target.value);
    state.pendingKehre = { a: null, b: null };
    render();
    toast(`👥 ${state.playerCount} Spieler`);
});

document.getElementById('kehrenSelect').addEventListener('change', function(e) {
    state.kehren = Number(e.target.value);
    state.arena.pointsA = Array(state.kehren).fill(null);
    state.arena.pointsB = Array(state.kehren).fill(null);
    state.editingIndex = null;
    state.pendingKehre = { a: null, b: null };
    render();
});

document.getElementById('gamesSelect').addEventListener('change', function(e) {
    state.winsToChampion = Number(e.target.value);
    render();
});

// ===== HÖHENKORREKTUR =====
function setCorrectHeight() {
    const vh = window.innerHeight;
    document.documentElement.style.setProperty('height', vh + 'px');
    document.body.style.setProperty('height', vh + 'px');
}

window.addEventListener('resize', setCorrectHeight);
window.addEventListener('orientationchange', function() {
    setTimeout(setCorrectHeight, 300);
});
setCorrectHeight();

render();
</script>

</body>
</html>
