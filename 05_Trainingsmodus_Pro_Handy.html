<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Trainingsmodus Smartphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#1f5e3a;
    --red:#b93a32;
    --gold:#ffdf8c;
    --dark:#102417;
    --light:#eef5e9;
    --border:#d7e4cf;

    --bg-main:#0a0e14;
    --bg-panel:#131b24;
    --line:rgba(255,255,255,0.08);
    --text-main:#eef2f6;
    --text-dim:#8a97a6;
    --accent:#33c5ff;
    --accent-hover:#5fd4ff;
    --font-display:"Space Grotesk","Inter",sans-serif;
    --font-body:"Inter",Segoe UI,Arial,sans-serif;

    --w-color:#4caf50;
    --e-color:#ff6b6b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
}

body{
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--bg-main),#0a0d12);
    color:var(--text-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header{
    position: sticky;
    top: 0;
    z-index: 500;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    color:var(--text-main);
    padding:8px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    flex-shrink:0;
    min-width:0; /* verhindert, dass lange Statustexte den Header über die Bildschirmbreite hinaus schieben */
    box-sizing:border-box;
}

.header h1{
    font-family:var(--font-display);
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-size:1.4rem;
    color:var(--text-main);
}
.header-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    min-width:0;
    max-width:100%;
}

button,
select,
input{
    border:none;
    border-radius:20px;
    padding:9px 13px;
    font-size:0.95rem;
    touch-action: manipulation;
    font-family:inherit;
}

button{
    cursor:pointer;
    background:var(--accent);
    color:white;
    font-weight:700;
    touch-action: manipulation;
    transition: transform 0.1s, background 0.15s;
}
button:hover{
    background:var(--accent-hover);
}

button:active {
    transform: scale(0.95);
}

.header-controls select{
    background:#1c2734;
    color:var(--text-main);
    border:1px solid var(--line);
    font-weight:600;
    font-size:0.85rem;
    padding:8px 10px;
}

.keyboard-status {
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 20px;
    background: #1c2734;
    color: var(--text-main);
    font-weight: 700;
    border:1px solid var(--line);
    white-space:nowrap;
    max-width:46vw;
    overflow:hidden;
    text-overflow:ellipsis;
}

.keyboard-status.waiting { background: #7a6a00; }
.keyboard-status.team-e { background: var(--e-color); color:#2a0505; }
.keyboard-status.team-w { background: var(--w-color); color:#062b09; }
.keyboard-status.training-ended { background: #9c27b0; color:#fff; }
.keyboard-status.pending { background: var(--gold); color:#332400; animation: blink 0.8s ease-in-out infinite; }

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
}

.layout{
    flex: 1;
    padding:14px;
    overflow: hidden;
    min-height: 0;
}

/* ===== ARENA (Hauptbildschirm = Zuschauermonitor-Layout) ===== */
.arena{
    width:100%;
    max-width:1900px;
    height:100%;
    background:linear-gradient(165deg,#132a1d,#0a1810);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    position:relative;
    margin: 0 auto;
    padding:16px 20px;
    gap:18px;
    color:#fff;
}

.arena-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex-shrink:0;
}

.kehre-badge{
    font-size:1.05rem;
    font-weight:800;
    padding:7px 18px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    color:#eef2f6;
    border:1px solid rgba(255,255,255,0.18);
    letter-spacing:0.02em;
    white-space:nowrap;
}
.kehre-badge.extra{
    background:var(--gold);
    color:#332400;
    border-color:transparent;
}
.kehre-badge.done{
    background:var(--w-color);
    color:#062b09;
    border-color:transparent;
}

.pending-preview{
    font-size:0.85rem;
    font-weight:800;
    padding:6px 14px;
    border-radius:20px;
    background:var(--gold);
    color:#332400;
    display:none;
}
.pending-preview.show{ display:inline-block; animation: blink 0.8s ease-in-out infinite; }

/* ===== TEAMS ROW =====
   Am Handy stehen beide Mannschaften kompakt nebeneinander (nur Ergebnis + Siege,
   antippen = auswählen) - EIN gemeinsamer Ziffernblock darunter bedient die jeweils
   ausgewählte Mannschaft. Zwei volle Ziffernblöcke übereinander wie am Tablet würden
   auf einem schmalen Bildschirm zu viel Scrollen erfordern. */
.teams-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    flex-shrink:0;
}

/* ===== ZIFFERNBLOCK (EIN gemeinsamer Block für die ausgewählte Mannschaft) ===== */
.keypad-panel{
    background:#0a1810;
    border-radius:18px;
    padding:10px;
    border:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
}
.keypad-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:8px;
}
.keypad-btn{
    background:#14261c;
    color:var(--text-main);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    font-size:1.6rem;
    font-weight:800;
    padding:19px 0;
    cursor:pointer;
    touch-action:manipulation;
    transition: transform 0.1s, background 0.15s;
}
.keypad-btn:active{ transform:scale(0.93); background:#1c362a; }
.keypad-btn:disabled{ opacity:0.3; cursor:default; }
.keypad-panel.team-w .keypad-btn:active{ background:#1c3d24; border-color:var(--w-color); }
.keypad-panel.team-e .keypad-btn:active{ background:#3d1c1c; border-color:var(--e-color); }
.keypad-hint{
    text-align:center;
    font-size:0.72rem;
    color:#65796d;
    padding-bottom:6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.team-block{
    background:#0f1f17;
    border-radius:18px;
    padding:12px;
    border-bottom:6px solid var(--w-color);
    box-shadow:0 5px 0 rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    gap:6px;
    transition: all 0.25s ease;
    cursor:pointer;
    min-width:0;
}
.team-block.e{ border-bottom-color:var(--e-color); }

.team-block.selected{
    transform: scale(1.02);
}
.team-block.w.selected{
    background:#123320;
    box-shadow:0 0 0 3px var(--w-color), 0 5px 0 rgba(0,0,0,.25);
}
.team-block.e.selected{
    background:#331414;
    box-shadow:0 0 0 3px var(--e-color), 0 5px 0 rgba(0,0,0,.25);
}

.team-block.flash{
    animation: teamFlash 0.6s ease;
}
@keyframes teamFlash {
    0%{ box-shadow:0 0 0 rgba(255,255,255,0); }
    35%{ box-shadow:0 0 45px 12px rgba(255,255,255,0.55); }
    100%{ box-shadow:0 0 0 rgba(255,255,255,0); }
}

.team-head{
    display:flex;
    justify-content:center;
    align-items:center;
    min-width:0;
    width:100%;
}

.team-label{
    font-weight:900;
    font-size:1.2rem;
    letter-spacing:0.3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    text-align:center;
    width:100%;
}

/* ===== GESAMTSIEGE (gemeinsame Anzeige über der Kehre-Anzeige) =====
   Dadurch muss sich der Mannschaftsname im Team-Block nicht mehr die Breite
   mit einem eigenen Sieg-Badge teilen und ist besser lesbar. */
.wins-summary{
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.1);
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,223,140,0.3);
}
.wins-summary .wins-label{
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#cbb987;
    font-weight:700;
    margin-right:2px;
}
.wins-summary .wins-value{
    font-size:1.6rem;
    font-weight:900;
    line-height:1.1;
}
.wins-summary .wins-value.w{ color: var(--w-color); }
.wins-summary .wins-value.e{ color: var(--e-color); }
.wins-summary .wins-sep{
    font-size:1.2rem;
    font-weight:700;
    color:#65796d;
}

@media (max-width: 480px){
    .wins-summary{ padding:5px 14px; gap:6px; }
    .wins-summary .wins-value{ font-size:1.3rem; }
}

/* Ergebnis-Anzeige: am Handy kompakt genug, damit beide Mannschaften nebeneinander
   UND der gemeinsame Ziffernblock ohne Scrollen auf den Bildschirm passen. */
.team-score-big {
    font-size: clamp(2.6rem, 14vh, 4.6rem);
    font-weight: 900;
    color: var(--w-color);
    line-height: 1;
    text-shadow: 0 4px 30px rgba(76,175,80,0.35);
    text-align:center;
    padding: 2px 0;
}
.team-block.e .team-score-big { color: var(--e-color); text-shadow: 0 4px 20px rgba(255,107,107,0.3); }

/* ===== EINGABE-HINWEIS (externes Tastenfeld, kein Bildschirm-Ziffernblock) ===== */
.input-hint-panel{
    background:#0a1810;
    border-radius:20px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.06);
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    justify-content:center;
    text-align:center;
}
.input-hint-status{
    font-size:1rem;
    font-weight:800;
    color:#eef2f6;
}
.input-hint-keys{
    font-size:0.78rem;
    color:#8aa89a;
    line-height:1.6;
}
.input-hint-keys kbd{
    background:#1c2734;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    padding:2px 7px;
    font-family:inherit;
    font-weight:700;
    color:#eef2f6;
}

/* ===== FOOTER-ROW (im arena) ===== */
.arena-footer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    flex-shrink:0;
}
.arena-footer button{
    padding:7px 13px;
    font-size:0.72rem;
}
.arena-footer .footer-right {
    font-size:0.72rem;
    color:#65796d;
    margin-left:auto;
}

/* ===== TRAINING BEENDET / MODALS ===== */
.training-ended-overlay {
    position: fixed; inset:0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20000;
    backdrop-filter: blur(5px);
}
.training-ended-overlay.show { display: flex; }
.training-ended-box {
    background: white; color:#222;
    border-radius: 30px;
    padding: 50px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    animation: pulse 1.5s ease-in-out;
}
@keyframes pulse {
    0% { transform: scale(0.9); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
}
.training-ended-box .trophy { font-size: 4rem; margin-bottom: 10px; }
.training-ended-box h2 { font-size: 2rem; margin-bottom: 10px; color: var(--green); }
.training-ended-box .winner-name { font-size: 2.5rem; font-weight: 900; color: var(--red); margin: 15px 0; overflow-wrap:break-word; }
.training-ended-box .score-summary { font-size: 1.2rem; color: #555; margin: 10px 0 20px; }
.training-ended-box .enter-hint { font-size: 0.9rem; color: #888; margin-top: 10px; padding: 8px; background: #f5f5f5; border-radius: 8px; }
.training-ended-box button { padding: 12px 30px; font-size: 1.1rem; background: var(--green); color: white; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; }

/* ===== MANNSCHAFTSNAMEN-MODAL ===== */
.team-name-overlay {
    position: fixed; inset:0;
    background: rgba(0,0,0,0.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20001;
    padding:16px;
}
.team-name-overlay.show { display: flex; }
.team-name-box {
    background: white; color:#222;
    border-radius: 22px;
    padding: 26px;
    max-width: 380px;
    width: 100%;
}
.team-name-box h3{
    color:var(--dark);
    margin-bottom:16px;
    font-size:1.2rem;
}
.team-name-box label{
    display:block;
    font-size:0.8rem;
    font-weight:700;
    color:#555;
    margin-bottom:5px;
    margin-top:12px;
}
.team-name-box label:first-of-type{ margin-top:0; }
.team-name-box input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    color:#222;
    background:#f7faf5;
}
.team-name-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}
.team-name-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-weight:700;
}

/* ===== EINSTELLUNGEN-MODAL (Siege / Kehren / Spieler an einem Ort) ===== */
.settings-overlay {
    position: fixed; inset:0;
    background: rgba(0,0,0,0.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20001;
    padding:16px;
}
.settings-overlay.show { display: flex; }
.settings-box {
    background: white; color:#222;
    border-radius: 22px;
    padding: 26px;
    max-width: 380px;
    width: 100%;
}
.settings-box h3{
    color:var(--dark);
    margin-bottom:16px;
    font-size:1.2rem;
}
.settings-box label{
    display:block;
    font-size:0.8rem;
    font-weight:700;
    color:#555;
    margin-bottom:5px;
    margin-top:14px;
}
.settings-box label:first-of-type{ margin-top:0; }
.settings-box select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    color:#222;
    background:#f7faf5;
    font-weight:600;
}
.settings-box .settings-done{
    width:100%;
    margin-top:22px;
    padding:12px;
    border-radius:10px;
    font-weight:700;
    background:var(--dark);
    color:white;
}

.toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#111; color:white; padding:14px 20px; border-radius:14px;
    opacity:0; transition:.3s; z-index:9999; pointer-events: none;
    font-size:1rem; max-width:90%; text-align:center;
}
.toast.show{ opacity:1; }
.toast.winner{ background: #4caf50; font-weight:700; font-size:1.2rem; }
.toast.warn{ background: #b93a32; font-weight:700; }
.toast.tie{ background: #ffdf8c; color:#332400; font-weight:800; }


.gold{ background:var(--gold); color:black; }
.gold:active{ background:#f0c860; }

/* ===== RESPONSIVE =====
   Die beiden Mannschafts-Kacheln bleiben immer nebeneinander (auch auf sehr schmalen
   Handys) - dank des EINEN gemeinsamen Ziffernblocks statt zwei kompletter Blöcke
   bleibt dafür auch bei 320-375px Breite genug Platz. */
@media (max-width: 480px){
    .header{ padding:6px 10px; }
    .header h1{ font-size:1.05rem; }
    .layout{ padding:8px; }
    .arena{ padding:10px; border-radius:16px; gap:8px; }
    .team-block{ padding:10px; }
    .team-score-big{ font-size:clamp(2.1rem, 11vh, 3.2rem); }
    .keypad-btn{ font-size:1.25rem; padding:12px 0; }
    .arena-footer{ gap:7px; }
    .arena-footer button{ padding:6px 10px; font-size:0.68rem; }
}

@media (max-height: 700px){
    .team-score-big{ font-size:clamp(1.8rem, 9vh, 2.8rem); }
    .keypad-btn{ padding:10px 0; }
}
</style>
</head>
<body>

<div class="header">
    <h1>Trainingsmodus Smartphone</h1>

    <div class="header-controls">
        <span class="keyboard-status" id="keyboardStatus" style="display:none;"></span>

        <button onclick="openSettings()" title="Spiele, Kehren, Spieler einstellen">⚙️</button>
        <button onclick="openTeamNameEditor()" title="Mannschaftsnamen ändern">✏️</button>
        <button onclick="fullReset()" style="background:#b93a32;" title="Kompletter Reset">↺</button>
    </div>
</div>

<div class="layout" id="layout"></div>

<!-- Training beendet Overlay -->
<div class="training-ended-overlay" id="trainingEndedOverlay">
    <div class="training-ended-box">
        <div class="trophy">🏆</div>
        <h2>Training beendet!</h2>
        <div class="winner-name" id="winnerName">Mannschaft W</div>
        <div class="score-summary" id="scoreSummary">Siege: 2 : 0</div>
        <div class="enter-hint">Antippen Sie „Neues Training starten“ für den nächsten Durchgang</div>
        <button onclick="startNewTraining()">Neues Training starten</button>
    </div>
</div>

<!-- Einstellungen-Modal (Siege / Kehren / Spieler) -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this){closeSettings();}">
    <div class="settings-box">
        <h3>⚙️ Einstellungen</h3>
        <label>🏆 Wie viele Siege für den Sieg?</label>
        <select id="gamesSelect">
            <option value="2" selected>2 Siege</option>
            <option value="3">3 Siege</option>
            <option value="4">4 Siege</option>
            <option value="5">5 Siege</option>
            <option value="6">6 Siege</option>
        </select>

        <label>🥌 Wie viele Kehren pro Spiel?</label>
        <select id="kehrenSelect">
            <option value="4">4 Kehren</option>
            <option value="6" selected>6 Kehren</option>
            <option value="8">8 Kehren</option>
            <option value="10">10 Kehren</option>
        </select>

        <label>👥 Wie viele Spieler pro Kehre?</label>
        <select id="playerCount">
            <option value="3">3 Spieler</option>
            <option value="4" selected>4 Spieler</option>
            <option value="5">5 Spieler</option>
            <option value="6">6 Spieler</option>
        </select>

        <button class="settings-done" onclick="closeSettings()">Fertig</button>
    </div>
</div>

<!-- Mannschaftsnamen-Modal -->
<div class="team-name-overlay" id="teamNameOverlay" onclick="if(event.target===this){closeTeamNameEditor();}">
    <div class="team-name-box">
        <h3>✏️ Mannschaftsnamen</h3>
        <label>⚪ Name Team 1</label>
        <input type="text" id="teamNameInputW" maxlength="24" placeholder="Mannschaft W" onkeydown="if(event.key==='Enter'){saveTeamNames();}">
        <label>🔴 Name Team 2</label>
        <input type="text" id="teamNameInputE" maxlength="24" placeholder="Mannschaft E" onkeydown="if(event.key==='Enter'){saveTeamNames();}">
        <div class="team-name-actions">
            <button onclick="saveTeamNames()">Speichern</button>
            <button onclick="closeTeamNameEditor()" style="background:#888;">Abbrechen</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- Eigenständiges Einzelprogramm für Tablets: kein Verweis auf das Dashboard/Portal,
     keine Zugangssperre (requireGate()/requireLogin() werden bewusst nicht aufgerufen) -
     sofort einsatzbereit, ohne weitere Module. -->
<script>
const PENDING_DIGIT_TIMEOUT = 650;
const TEAM_NAMES_KEY = 'trainingsmodus_handy_teamnamen';

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ===== MANNSCHAFTSNAMEN =====
function loadTeamNames() {
    try {
        const data = JSON.parse(localStorage.getItem(TEAM_NAMES_KEY));
        if (data && typeof data.w === 'string' && typeof data.e === 'string' && data.w && data.e) {
            return data;
        }
    } catch (e) {}
    return { w: 'Mannschaft W', e: 'Mannschaft E' };
}

function saveTeamNamesToStorage() {
    try { localStorage.setItem(TEAM_NAMES_KEY, JSON.stringify(state.teamNames)); } catch (e) {}
}

function openTeamNameEditor() {
    document.getElementById('teamNameInputW').value = state.teamNames.w;
    document.getElementById('teamNameInputE').value = state.teamNames.e;
    document.getElementById('teamNameOverlay').classList.add('show');
}

function closeTeamNameEditor() {
    document.getElementById('teamNameOverlay').classList.remove('show');
}

function saveTeamNames() {
    const w = document.getElementById('teamNameInputW').value.trim() || 'Mannschaft W';
    const e = document.getElementById('teamNameInputE').value.trim() || 'Mannschaft E';
    state.teamNames = { w, e };
    saveTeamNamesToStorage();
    closeTeamNameEditor();
    render();
    toast('✅ Mannschaftsnamen gespeichert');
}

// ===== EINSTELLUNGEN-MODAL =====
function openSettings() {
    document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('show');
}

// ===== STATE =====
const state = {
    kehren: 6,
    winsToChampion: 2,
    playerCount: 4,
    arena: null,                    // wird gleich nach der Deklaration gesetzt (siehe unten)
    selectedTeam: null,             // 'w' | 'e' | null
    isTrainingEnded: false,
    targetKehre: null,              // manuell angetippte Kehre (Korrektur), sonst null = automatisch
    pendingDigit: null,             // { digit, timeoutId } für 2-stellige Eingabe (z.B. "10")
    teamNames: loadTeamNames()
};
// createArena() liest state.kehren, daher erst NACH der obigen Deklaration aufrufen
// (sonst "Cannot access 'state' before initialization").
state.arena = createArena();

// ===== KEYBOARD (optional – z.B. externe Tastatur/Nummernblock am Raspberry) =====
function setupKeyboard() {
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === 'NumpadEnter') {
            e.preventDefault();
            if (state.isTrainingEnded) {
                startNewTraining();
                toast('🔄 Neues Training gestartet!');
            } else {
                evaluateGame();
            }
            return;
        }

        if (e.key === 'Escape') {
            if (state.pendingDigit) {
                e.preventDefault();
                cancelPendingDigit();
            }
            return;
        }

        if (state.isTrainingEnded) return;

        if (e.key === '/' || e.key === 'Divide' || e.code === 'NumpadDivide') {
            e.preventDefault();
            deleteKehreEntry();
            return;
        }

        if (e.key === '-' || e.key === 'Minus' || e.key === 'Subtract') {
            e.preventDefault();
            selectTeam('e');
            return;
        }

        if (e.key === '+' || e.key === 'Plus' || e.key === 'Add' || e.key === '=') {
            e.preventDefault();
            selectTeam('w');
            return;
        }

        const numMap = {
            'Numpad0':'0','Numpad1':'1','Numpad2':'2','Numpad3':'3','Numpad4':'4',
            'Numpad5':'5','Numpad6':'6','Numpad7':'7','Numpad8':'8','Numpad9':'9'
        };
        if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            handleDigit(e.key);
            return;
        }
        if (numMap[e.key]) {
            e.preventDefault();
            handleDigit(numMap[e.key]);
            return;
        }
    });
}

// ===== TEAM AUSWAHL =====
function selectTeam(team) {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        return;
    }
    state.selectedTeam = (state.selectedTeam === team) ? null : team;
    updateKeyboardStatus();
    render();
    if (state.selectedTeam) {
        flashTeam(state.selectedTeam);
    }
}

function flashTeam(team) {
    requestAnimationFrame(() => {
        const el = document.getElementById('teamBlock-' + team);
        if (!el) return;
        el.classList.remove('flash');
        // reflow um die Animation erneut zu starten
        void el.offsetWidth;
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 650);
    });
}

// ===== ZIFFERNEINGABE (Kehren-Ergebnis: 1- oder 2-stellig) =====
function handleDigit(d) {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        return;
    }
    if (!state.selectedTeam) {
        toast('⚠️ Bitte zuerst Mannschaft antippen (oben antippen)');
        return;
    }

    const arena = state.arena;
    if (hasWinner(arena)) {
        endTraining(arena);
        return;
    }

    const maxPoints = state.playerCount;

    if (state.pendingDigit) {
        clearTimeout(state.pendingDigit.timeoutId);
        const first = state.pendingDigit.digit;
        state.pendingDigit = null;
        const combined = Number(first + d);
        if (first === '1' && d === '0' && combined <= maxPoints) {
            commitValue(combined);
        } else {
            commitValue(Number(first));
            toast('ℹ️ Zweite Ziffer ignoriert – bitte Mannschaft erneut wählen');
        }
        render();
        return;
    }

    // Möglicher Start einer 2-stelligen Eingabe (aktuell nur relevant für "10")
    if (d === '1' && maxPoints >= 10) {
        state.pendingDigit = {
            digit: d,
            timeoutId: setTimeout(() => {
                commitValue(1);
                render();
            }, PENDING_DIGIT_TIMEOUT)
        };
        render();
        return;
    }

    const v = Number(d);
    if (v > maxPoints) {
        toast(`⚠️ Maximal ${maxPoints} Punkte pro Kehre möglich`);
        return;
    }
    commitValue(v);
}

function cancelPendingDigit() {
    if (state.pendingDigit) {
        clearTimeout(state.pendingDigit.timeoutId);
        state.pendingDigit = null;
        render();
        toast('Eingabe abgebrochen');
    }
}

function activeKehreIndexForEntry() {
    if (state.targetKehre !== null && state.targetKehre !== undefined) return state.targetKehre;
    return activeKehre(state.arena) - 1;
}

function commitValue(v) {
    const arena = state.arena;
    const idx = activeKehreIndexForEntry();
    if (idx < 0 || idx >= arena.totalKehren) return;

    const team = state.selectedTeam;
    if (team === 'w') {
        arena.pointsA[idx] = v;
        if (arena.pointsB[idx] === null) arena.pointsB[idx] = 0;
    } else {
        arena.pointsB[idx] = v;
        if (arena.pointsA[idx] === null) arena.pointsA[idx] = 0;
    }

    const otherValue = team === 'w' ? arena.pointsB[idx] : arena.pointsA[idx];
    const teamName = team === 'w' ? state.teamNames.w : state.teamNames.e;
    const otherName = team === 'w' ? state.teamNames.e : state.teamNames.w;

    state.selectedTeam = null;
    state.targetKehre = null;
    updateKeyboardStatus();
    render();

    toast(`✅ Kehre ${idx + 1}: ${teamName} ${v} | ${otherName} ${otherValue}`);

    if (checkAllKehrenFull(arena)) {
        setTimeout(() => {
            toast('📊 Alle Kehren gespielt - Wertung läuft...');
            setTimeout(() => evaluateGame(), 500);
        }, 300);
    }
}

function getMostRecentCompletedIndex(arena) {
    for (let i = arena.totalKehren - 1; i >= 0; i--) {
        if (arena.pointsA[i] !== null || arena.pointsB[i] !== null) return i;
    }
    return -1;
}

function deleteKehreEntry() {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        return;
    }
    const arena = state.arena;
    let idx = state.targetKehre;
    if (idx === null || idx === undefined) {
        idx = getMostRecentCompletedIndex(arena);
    }
    if (idx === -1 || idx === null || idx === undefined) {
        toast('Keine Kehre zum Löschen vorhanden');
        return;
    }
    if (arena.pointsA[idx] === null && arena.pointsB[idx] === null) {
        toast(`Kehre ${idx + 1} ist bereits leer`);
        return;
    }
    arena.pointsA[idx] = null;
    arena.pointsB[idx] = null;
    arena.scorerA[idx] = null;
    arena.scorerB[idx] = null;
    state.targetKehre = idx;
    cancelPendingDigit();
    toast(`🗑️ Kehre ${idx + 1} gelöscht – bitte neu eingeben`);
    render();
}

// ===== SPIEL WERTEN =====
function evaluateGame() {
    const arena = state.arena;

    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        return;
    }

    if (hasWinner(arena)) {
        endTraining(arena);
        return;
    }

    for (let i = 0; i < arena.totalKehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
            toast('Bitte alle Kehren ausfüllen');
            return;
        }
    }

    const a = sum(arena.pointsA);
    const b = sum(arena.pointsB);

    if (a === b) {
        // Unentschieden: wie im Trainingsmodus Pro werden 2 weitere Kehren angehängt,
        // das laufende Spiel wird dabei NICHT zurückgesetzt. Bleibt es erneut
        // unentschieden, werden wieder 2 weitere Kehren angehängt usw.
        arena.pointsA.push(null, null);
        arena.pointsB.push(null, null);
        arena.scorerA.push(null, null);
        arena.scorerB.push(null, null);
        arena.totalKehren += 2;
        state.targetKehre = null;
        toast(`⚖️ Unentschieden (${a}:${b}) – 2 weitere Kehren!`, 'tie');
        render();
        return;
    }

    let gameResult = '';
    if (a > b) {
        arena.winsA++;
        gameResult = `⚪ ${state.teamNames.w} gewinnt (${a}:${b})`;
    } else {
        arena.winsB++;
        gameResult = `🔴 ${state.teamNames.e} gewinnt (${a}:${b})`;
    }
    toast(gameResult);

    arena.pointsA = Array(state.kehren).fill(null);
    arena.pointsB = Array(state.kehren).fill(null);
    arena.scorerA = Array(state.kehren).fill(null);
    arena.scorerB = Array(state.kehren).fill(null);
    arena.totalKehren = state.kehren;
    state.targetKehre = null;

    render();

    if (hasWinner(arena)) {
        setTimeout(() => endTraining(arena), 1000);
    } else {
        setTimeout(() => {
            toast(`🔄 Neues Spiel beginnt! Stand: W ${arena.winsA} : ${arena.winsB} E`);
            render();
        }, 500);
    }
}

// ===== TRAINING BEENDEN =====
function endTraining(arena) {
    state.isTrainingEnded = true;
    updateKeyboardStatus();

    const side = arena.winsA >= state.winsToChampion ? 'w' : 'e';
    const winner = side === 'w' ? state.teamNames.w : state.teamNames.e;
    const overlay = document.getElementById('trainingEndedOverlay');
    const winnerEl = document.getElementById('winnerName');
    const summaryEl = document.getElementById('scoreSummary');

    winnerEl.textContent = winner;
    winnerEl.style.color = side === 'w' ? '#4caf50' : '#ff6b6b';
    summaryEl.textContent = `Siege: ${arena.winsA} : ${arena.winsB}`;

    overlay.classList.add('show');

    const toastEl = document.getElementById('toast');
    toastEl.textContent = `🏆 ${winner} gewinnt das Training! „Neues Training starten“ antippen`;
    toastEl.className = 'toast show winner';
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => {
        toastEl.classList.remove('show');
        toastEl.className = 'toast';
    }, 5000);
}

function startNewTraining() {
    const overlay = document.getElementById('trainingEndedOverlay');
    overlay.classList.remove('show');

    state.isTrainingEnded = false;
    state.arena = createArena();
    state.selectedTeam = null;
    state.targetKehre = null;
    cancelPendingDigit();
    updateKeyboardStatus();
    render();
    toast('🔄 Neues Training gestartet!');
}

// ===== STATUS UPDATE =====
function updateKeyboardStatus() {
    const statusEl = document.getElementById('keyboardStatus');

    if (state.isTrainingEnded) {
        statusEl.textContent = '🏁 Training beendet – neu starten';
        statusEl.className = 'keyboard-status training-ended';
        statusEl.style.display = '';
        return;
    }

    if (state.pendingDigit) {
        statusEl.textContent = `⌨️ „${state.pendingDigit.digit}…” – 2. Ziffer?`;
        statusEl.className = 'keyboard-status pending';
        statusEl.style.display = '';
        return;
    }

    if (state.selectedTeam) {
        const teamLabel = state.selectedTeam === 'w' ? ('⚪ ' + state.teamNames.w) : ('🔴 ' + state.teamNames.e);
        const idx = activeKehreIndexForEntry();
        const targetLabel = state.targetKehre !== null
            ? ` – Korrektur ${state.targetKehre + 1}`
            : ` – Kehre ${idx + 1}/${state.arena.totalKehren}`;
        statusEl.textContent = `${teamLabel}${targetLabel}`;
        statusEl.className = 'keyboard-status ' + (state.selectedTeam === 'w' ? 'team-w' : 'team-e');
        statusEl.style.display = '';
    } else {
        statusEl.textContent = '';
        statusEl.className = 'keyboard-status';
        statusEl.style.display = 'none';
    }
}

// ===== RENDER =====
function render() {
    document.getElementById('layout').innerHTML = renderArena(state.arena);
    if (!state.isTrainingEnded) {
        updateKeyboardStatus();
    }
}

function renderArena(arena) {
    const scoreA = sum(arena.pointsA);
    const scoreB = sum(arena.pointsB);

    const wSelected = state.selectedTeam === 'w' ? 'selected' : '';
    const eSelected = state.selectedTeam === 'e' ? 'selected' : '';

    const allFull = checkAllKehrenFull(arena);
    const kehreNow = Math.min(activeKehre(arena), arena.totalKehren);
    const isExtra = arena.totalKehren > state.kehren;
    const badgeClass = allFull ? 'done' : (isExtra ? 'extra' : '');
    const badgeText = allFull
        ? `🥌 Alle ${arena.totalKehren} Kehren gespielt`
        : `🥌 Kehre ${kehreNow} von ${arena.totalKehren}`;

    return `
    <div class="arena">
        <div class="arena-top">
            <div class="wins-summary">
                <span class="wins-label">Siege</span>
                <span class="wins-value w">🏆 ${arena.winsA}</span>
                <span class="wins-sep">:</span>
                <span class="wins-value e">${arena.winsB} 🏆</span>
            </div>
            <div class="kehre-badge ${badgeClass}">${badgeText}</div>
            <div class="pending-preview ${state.pendingDigit ? 'show' : ''}">Eingabe: ${state.pendingDigit ? state.pendingDigit.digit + '…' : ''}</div>
        </div>

        <div class="teams-row">
            ${renderTeamBlock('w', state.teamNames.w, '⚪', scoreA, wSelected)}
            ${renderTeamBlock('e', state.teamNames.e, '🔴', scoreB, eSelected)}
        </div>

        ${renderKeypad()}

        <div class="arena-footer">
            <button class="gold" onclick="evaluateGame()">▶ Werten</button>
            <button onclick="resetGame()">🔁 Neues Spiel</button>
            <button onclick="deleteKehreEntry()" style="background:var(--red);">🗑 Löschen</button>
        </div>
    </div>
    `;
}

function renderTeamBlock(team, label, icon, score, selectedClass) {
    return `
    <div class="team-block ${team === 'e' ? 'e' : 'w'} ${selectedClass}" id="teamBlock-${team}" onclick="selectTeam('${team}')">
        <div class="team-head">
            <div class="team-label">${icon} ${escapeHtml(label)}</div>
        </div>
        <div class="team-score-big">${score}</div>
    </div>`;
}

// EIN gemeinsamer Ziffernblock für die jeweils ausgewählte Mannschaft (statt je
// Mannschaft ein eigener) - spart auf dem schmalen Handy-Bildschirm viel Platz.
// Antippen einer Mannschafts-Kachel wählt sie aus, danach hier die Punkte eingeben.
function renderKeypad() {
    const maxPoints = state.playerCount;
    const team = state.selectedTeam;
    const digits = ['1','2','3','4','5','6','7','8','9','0'];
    const btns = digits.map(d => {
        const disabled = Number(d) > maxPoints && !(d === '0');
        return `<button class="keypad-btn" ${disabled ? 'disabled' : ''} onclick="handleDigit('${d}')">${d}</button>`;
    }).join('');
    const teamClass = team ? `team-${team}` : '';
    const hint = team
        ? `${team === 'w' ? '⚪ ' + escapeHtml(state.teamNames.w) : '🔴 ' + escapeHtml(state.teamNames.e)} ausgewählt – Punkte eingeben`
        : 'Erst Mannschaft oben antippen, dann Punkte eingeben';
    return `
    <div class="keypad-panel ${teamClass}">
        <div class="keypad-hint">${hint}</div>
        <div class="keypad-grid">${btns}</div>
    </div>`;
}

// ===== HELFER =====
function createArena() {
    return {
        teamA: 'Mannschaft W',
        teamB: 'Mannschaft E',
        totalKehren: state.kehren,
        pointsA: Array(state.kehren).fill(null),
        pointsB: Array(state.kehren).fill(null),
        scorerA: Array(state.kehren).fill(null),
        scorerB: Array(state.kehren).fill(null),
        winsA: 0,
        winsB: 0
    };
}

function activeKehre(arena) {
    for (let i = 0; i < arena.totalKehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
            return i + 1;
        }
    }
    return arena.totalKehren;
}

function hasWinner(arena) {
    return arena.winsA >= state.winsToChampion || arena.winsB >= state.winsToChampion;
}

function sum(arr) {
    return arr.reduce((a, b) => a + (b || 0), 0);
}

function checkAllKehrenFull(arena) {
    for (let i = 0; i < arena.totalKehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) return false;
    }
    return true;
}

function resetGame() {
    if (state.isTrainingEnded) {
        startNewTraining();
        return;
    }
    const arena = state.arena;
    arena.pointsA = Array(state.kehren).fill(null);
    arena.pointsB = Array(state.kehren).fill(null);
    arena.scorerA = Array(state.kehren).fill(null);
    arena.scorerB = Array(state.kehren).fill(null);
    arena.totalKehren = state.kehren;
    arena.winsA = 0;
    arena.winsB = 0;
    state.selectedTeam = null;
    state.targetKehre = null;
    cancelPendingDigit();
    updateKeyboardStatus();
    render();
    toast('Spiel neu gestartet');
}

function fullReset() {
    state.arena = createArena();
    state.selectedTeam = null;
    state.targetKehre = null;
    state.isTrainingEnded = false;
    cancelPendingDigit();
    updateKeyboardStatus();
    document.getElementById('trainingEndedOverlay').classList.remove('show');
    render();
    toast('Kompletter Reset');
}

function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    if (type === 'warn') t.classList.add('warn');
    if (type === 'tie') t.classList.add('tie');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => {
        t.classList.remove('show');
        t.className = 'toast';
    }, 3000);
}

// ===== EVENT-LISTENER (Header-Auswahl) =====
document.getElementById('playerCount').addEventListener('change', function(e) {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        e.target.value = state.playerCount;
        return;
    }
    state.playerCount = Number(e.target.value);
    state.selectedTeam = null;
    cancelPendingDigit();
    updateKeyboardStatus();
    render();
    toast(`👥 ${state.playerCount} Spieler/Kehre`);
});

document.getElementById('kehrenSelect').addEventListener('change', function(e) {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        e.target.value = state.kehren;
        return;
    }
    state.kehren = Number(e.target.value);
    state.arena.totalKehren = state.kehren;
    state.arena.pointsA = Array(state.kehren).fill(null);
    state.arena.pointsB = Array(state.kehren).fill(null);
    state.arena.scorerA = Array(state.kehren).fill(null);
    state.arena.scorerB = Array(state.kehren).fill(null);
    state.selectedTeam = null;
    state.targetKehre = null;
    cancelPendingDigit();
    updateKeyboardStatus();
    render();
});

document.getElementById('gamesSelect').addEventListener('change', function(e) {
    if (state.isTrainingEnded) {
        toast('Training ist beendet! „Neues Training starten“ antippen');
        e.target.value = state.winsToChampion;
        return;
    }
    state.winsToChampion = Number(e.target.value);
    render();
});

// ===== HÖHENKORREKTUR =====
function setCorrectHeight() {
    const vh = window.innerHeight;
    document.documentElement.style.setProperty('height', vh + 'px');
    document.body.style.setProperty('height', vh + 'px');
}

window.addEventListener('resize', setCorrectHeight);
window.addEventListener('orientationchange', function() {
    setTimeout(setCorrectHeight, 300);
});
setCorrectHeight();

// ===== INIT =====
setupKeyboard();
render();
</script>
